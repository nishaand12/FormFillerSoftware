name: Build macOS arm64 DMG

on:
  push:
    branches:
      - universal-metal-build
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build-universal:
    name: Build macOS arm64 DMG
    runs-on: macos-15
    env:
      SKIP_CODESIGN_VERIFY: "0"
      APP_BUNDLE_ID: "com.ceteasystems.formfiller"
      CMAKE_ARGS: "-DGGML_CPU_ARM_ENABLE_I8MM=OFF -DGGML_CPU_ARM_USE_I8MM=OFF -DGGML_METAL=ON"
      PIP_EXTRA_INDEX_URL: "https://abetlen.github.io/llama-cpp-python/whl/metal"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Import Developer ID certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.DEV_ID_CERT }}
          p12-password: ${{ secrets.DEV_ID_CERT_PASSWORD }}

      - name: Configure notarization credentials
        env:
          AC_KEY_B64: ${{ secrets.AC_API_KEY }}
          AC_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_ISSUER_ID: ${{ secrets.AC_ISSUER_ID }}
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.private_keys"
          KEY_PATH="${HOME}/.private_keys/AuthKey_${AC_KEY_ID}.p8"
          printf '%s' "${AC_KEY_B64}" | base64 --decode > "${KEY_PATH}"
          chmod 600 "${KEY_PATH}"
          {
            echo "NOTARIZATION_KEY_PATH=${KEY_PATH}"
            echo "NOTARIZATION_KEY_ID=${AC_KEY_ID}"
            echo "NOTARIZATION_ISSUER_ID=${AC_ISSUER_ID}"
          } >> "${GITHUB_ENV}"

      - name: Detect signing identity
        run: |
          set -euo pipefail
          IDENTITY=$(security find-identity -p codesigning -v | awk -F\" '/Developer ID Application/ {print $2; exit}')
          if [ -z "${IDENTITY}" ]; then
            echo "❌ Developer ID Application identity not found in keychain" >&2
            security find-identity -p codesigning -v
            exit 1
          fi
          echo "Using signing identity: ${IDENTITY}"
          echo "SIGNING_IDENTITY=${IDENTITY}" >> "${GITHUB_ENV}"

      - name: Install build tooling
        run: |
          set -euo pipefail
          echo "🛠️ Installing build toolchain (pip/setuptools/wheel/scikit-build-core/cmake/ninja)..."
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --no-cache-dir scikit-build-core cmake ninja

      - name: Verify runner architecture
        run: |
          echo "🔍 Runner architecture: $(uname -m)"
          python3 -c "import platform; print(f'Python architecture: {platform.machine()}')"

      - name: Ensure Rosetta 2 for x86_64 tools
        if: ${{ runner.arch == 'ARM64' }}
        run: |
          set -euo pipefail
          echo "➡️ Installing Rosetta 2 (Needed for x86_64 binaries)..."
          sudo softwareupdate --install-rosetta --agree-to-license || echo "Rosetta 2 already installed"
          /usr/bin/pgrep oahd >/dev/null && echo "✅ Rosetta 2 active" || echo "⚠️ Rosetta 2 service not detected"

      - name: Get version from VERSION file
        id: get_version
        run: |
          VERSION=$(tr -d '\n\r ' < VERSION)
          if [ -z "$VERSION" ]; then
            echo "VERSION file is empty" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "📦 Building version: $VERSION"

      - name: Create Supabase config
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          mkdir -p config
          cat <<EOF > config/supabase_config.json
          {
            "supabase_url": "${SUPABASE_URL}",
            "supabase_anon_key": "${SUPABASE_ANON_KEY}"
          }
          EOF
          echo "✅ Supabase config created"

      - name: Install dependencies
        run: |
          set -euo pipefail
          export CMAKE_ARGS="-DGGML_CPU_ARM_ENABLE_I8MM=OFF -DGGML_CPU_ARM_USE_I8MM=OFF -DGGML_METAL=ON"
          export GGML_METAL_PATH="/System/Library/Frameworks/Metal.framework"
          echo "🔧 CMAKE_ARGS=${CMAKE_ARGS}"
          export PIP_NO_BUILD_ISOLATION=0
          echo "📦 Installing Python dependencies..."
          python -m pip install --no-cache-dir -r requirements.txt

      - name: Prepare runtime dependencies
        run: |
          set -euo pipefail
          echo "🛠️ Preparing runtime dependencies..."
          python -m build_support.prepare_universal_env || true

      - name: Generate PyInstaller ARM64 spec
        run: |
          set -euo pipefail
          echo "📝 Generating PyInstaller spec for ARM64..."
          python scripts/generate_arm64_spec.py || true

      - name: Build arm64 DMG
        run: |
          set -euo pipefail
          echo "🔨 Building notarized arm64 DMG..."
          python build_mac.py

      - name: Bundle diagnostics
        if: always()
        run: |
          set -euo pipefail
          if [ -d "dist/PhysioClinicAssistant.app" ]; then
            echo "📦 App bundle size:"
            du -sh dist/PhysioClinicAssistant.app
            echo ""
            echo "📂 Size of top-level Contents items:"
            du -sh dist/PhysioClinicAssistant.app/Contents/* 2>/dev/null | sort -hr | head -n 20 || true
            echo ""
            echo "🧩 Largest framework binaries:"
            find dist/PhysioClinicAssistant.app/Contents/Frameworks -type f \( -name "*.dylib" -o -name "*.so" -o -name "*.framework" \) -print0 2>/dev/null | xargs -0 du -sh 2>/dev/null | sort -hr | head -n 20 || true
            echo ""
            echo "🔐 codesign verification timing:"
            /usr/bin/time -l codesign --verify --deep --strict --verbose=4 dist/PhysioClinicAssistant.app || true
          else
            echo "⚠️ dist/PhysioClinicAssistant.app not found; skipping diagnostics."
          fi
          if compgen -G "PhysioClinicAssistant-*-macOS.dmg" > /dev/null; then
            echo ""
            echo "💾 DMG size:"
            du -sh PhysioClinicAssistant-*-macOS.dmg
          fi

      - name: Verify arm64 binaries
        run: |
          set -euo pipefail
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          DMG="PhysioClinicAssistant-${VERSION}-macOS.dmg"
          if [ ! -f "$DMG" ]; then
            echo "❌ DMG not found" >&2
            ls -lh
            exit 1
          fi

          echo "✅ DMG created: $DMG"
          hdiutil attach "$DMG" -mountpoint /tmp/dmg_verify -readonly
          EXECUTABLE="/tmp/dmg_verify/PhysioClinicAssistant.app/Contents/MacOS/PhysioClinicAssistant"
          echo "Main executable architecture:"
          lipo -info "$EXECUTABLE"
          if ! lipo -info "$EXECUTABLE" | grep -q "architecture: arm64"; then
            echo "❌ Expected arm64 architecture in main executable" >&2
            exit 1
          fi

          echo "Key ggml library architectures:"
          find "/tmp/dmg_verify/PhysioClinicAssistant.app/Contents/Frameworks" \( -name "libggml*.dylib" -o -name "libllama.dylib" \) | while IFS= read -r lib; do
            echo "- $lib"
            lipo -info "$lib" 2>/dev/null || file "$lib"
          done

          hdiutil detach /tmp/dmg_verify

      - name: Rename DMG to arm64 variant
        run: |
          set -euo pipefail
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          mv "PhysioClinicAssistant-${VERSION}-macOS.dmg" "PhysioClinicAssistant-${VERSION}-macOS-arm64.dmg"
          ls -lh PhysioClinicAssistant-*-macOS-arm64.dmg

      - name: Notarization submission history (latest)
        if: always()
        env:
          AC_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_ISSUER_ID: ${{ secrets.AC_ISSUER_ID }}
        run: |
          set -euo pipefail
          if [ -f "${NOTARIZATION_KEY_PATH}" ]; then
            echo "🗒️ Recent notarization submissions:"
            xcrun notarytool history \
              --key "${NOTARIZATION_KEY_PATH}" \
              --key-id "${AC_KEY_ID}" \
              --issuer "${AC_ISSUER_ID}" || true
            
            echo ""
            echo "📋 Fetching detailed logs for submissions..."
            
            # Get all rejected submission IDs to see why they failed
            echo ""
            echo "🔍 Checking rejected submissions for detailed logs:"
            REJECTED_IDS=$(xcrun notarytool history \
              --key "${NOTARIZATION_KEY_PATH}" \
              --key-id "${AC_KEY_ID}" \
              --issuer "${AC_ISSUER_ID}" \
              --output-format json 2>/dev/null | \
              python3 -c "
import sys, json
try:
    data = json.load(sys.stdin)
    if isinstance(data, list):
        for entry in data:
            if isinstance(entry, dict) and entry.get('status') in ['Rejected', 'Invalid']:
                print(entry.get('id', ''))
except:
    pass
" 2>/dev/null || echo "")
            
            if [ -n "${REJECTED_IDS}" ]; then
              echo "${REJECTED_IDS}" | while read -r REJECTED_ID; do
                if [ -n "${REJECTED_ID}" ]; then
                  echo ""
                  echo "📄 Log for rejected submission ${REJECTED_ID}:"
                  xcrun notarytool log "${REJECTED_ID}" \
                    --key "${NOTARIZATION_KEY_PATH}" \
                    --key-id "${AC_KEY_ID}" \
                    --issuer "${AC_ISSUER_ID}" 2>&1 || echo "⚠️ Could not fetch log"
                  echo "---"
                fi
              done
            else
              echo "No rejected submissions found in JSON format, trying text parsing..."
              # Fallback: try to get rejected IDs from text format
              # Parse the history output to find rejected submissions
              # Format: id comes before status in the output
              xcrun notarytool history \
                --key "${NOTARIZATION_KEY_PATH}" \
                --key-id "${AC_KEY_ID}" \
                --issuer "${AC_ISSUER_ID}" 2>/dev/null | \
                python3 -c "
import sys
lines = sys.stdin.readlines()
current_id = None
for line in lines:
    line_lower = line.lower()
    if 'id:' in line_lower:
        # Extract ID
        parts = line.split(':', 1)
        if len(parts) > 1:
            current_id = parts[1].strip()
    elif ('status: rejected' in line_lower or 'status: invalid' in line_lower):
        if current_id:
            print(current_id)
        current_id = None
" 2>/dev/null | \
                while read -r REJECTED_ID; do
                  if [ -n "${REJECTED_ID}" ]; then
                    echo ""
                    echo "📄 Log for rejected submission ${REJECTED_ID}:"
                    xcrun notarytool log "${REJECTED_ID}" \
                      --key "${NOTARIZATION_KEY_PATH}" \
                      --key-id "${AC_KEY_ID}" \
                      --issuer "${AC_ISSUER_ID}" 2>&1 || echo "⚠️ Could not fetch log"
                    echo "---"
                  fi
                done || true
            fi
            
            # Also check the most recent submission (even if in progress)
            echo ""
            echo "📋 Checking most recent submission:"
            LATEST_ID=$(xcrun notarytool history \
              --key "${NOTARIZATION_KEY_PATH}" \
              --key-id "${AC_KEY_ID}" \
              --issuer "${AC_ISSUER_ID}" \
              --output-format json 2>/dev/null | \
              python3 -c "import sys, json; data=json.load(sys.stdin); print(data[0]['id'] if data and len(data) > 0 and isinstance(data, list) else '')" 2>/dev/null || echo "")
            
            if [ -z "${LATEST_ID}" ] || [ "${LATEST_ID}" = "null" ]; then
              LATEST_ID=$(xcrun notarytool history \
                --key "${NOTARIZATION_KEY_PATH}" \
                --key-id "${AC_KEY_ID}" \
                --issuer "${AC_ISSUER_ID}" 2>/dev/null | \
                grep -E "^\s+id:" | head -1 | sed 's/^[[:space:]]*id:[[:space:]]*//' | tr -d '\n' || echo "")
            fi
            
            if [ -n "${LATEST_ID}" ] && [ "${LATEST_ID}" != "null" ]; then
              echo "Most recent submission ID: ${LATEST_ID}"
              echo "📄 Detailed notarization log (if available):"
              xcrun notarytool log "${LATEST_ID}" \
                --key "${NOTARIZATION_KEY_PATH}" \
                --key-id "${AC_KEY_ID}" \
                --issuer "${AC_ISSUER_ID}" 2>&1 || echo "⚠️ Log not yet available (submission may still be processing)"
            fi
          else
            echo "⚠️ Notarization key path not found; skipping history."
          fi

      - name: Upload arm64 DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: physioclinicassistant-macos-arm64
          path: PhysioClinicAssistant-*-macOS-arm64.dmg
          retention-days: 30

      - name: Build summary
        if: success()
        run: |
          {
            echo "## ✅ macOS arm64 Build Complete"
            echo "- Branch: $GITHUB_REF"
            echo "- DMG: PhysioClinicAssistant-${{ steps.get_version.outputs.VERSION }}-macOS-arm64.dmg"
            echo "- Target architecture: arm64 (Apple silicon)"
          } >> "$GITHUB_STEP_SUMMARY"
