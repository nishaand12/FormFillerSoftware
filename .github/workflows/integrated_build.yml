name: Build Universal macOS DMG

on:
  push:
    branches:
      - universal-metal-build
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build-universal:
    name: Build Universal (Intel + Apple Silicon) DMG
    runs-on: macos-15
    env:
      SIGNING_IDENTITY: ""
      NOTARIZATION_TEAM_ID: ""
      NOTARIZATION_USERNAME: ""
      NOTARIZATION_PASSWORD: ""
      SKIP_CODESIGN_VERIFY: "1"
      CMAKE_ARGS: "-DGGML_CPU_ARM_ENABLE_I8MM=OFF -DGGML_CPU_ARM_USE_I8MM=OFF"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Verify runner architecture
        run: |
          echo "🔍 Runner architecture: $(uname -m)"
          python3 -c "import platform; print(f'Python architecture: {platform.machine()}')"

      - name: Ensure Rosetta 2 for x86_64 tools
        if: ${{ runner.arch == 'ARM64' }}
        run: |
          set -euo pipefail
          echo "➡️ Installing Rosetta 2 (Needed for x86_64 binaries)..."
          sudo softwareupdate --install-rosetta --agree-to-license || echo "Rosetta 2 already installed"
          /usr/bin/pgrep oahd >/dev/null && echo "✅ Rosetta 2 active" || echo "⚠️ Rosetta 2 service not detected"

      - name: Get version from VERSION file
        id: get_version
        run: |
          VERSION=$(tr -d '\n\r ' < VERSION)
          if [ -z "$VERSION" ]; then
            echo "VERSION file is empty" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "📦 Building version: $VERSION"

      - name: Create Supabase config
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          mkdir -p config
          cat <<EOF > config/supabase_config.json
          {
            "supabase_url": "${SUPABASE_URL}",
            "supabase_anon_key": "${SUPABASE_ANON_KEY}"
          }
          EOF
          echo "✅ Supabase config created"

      - name: Install dependencies
        run: |
          set -euo pipefail
          export CMAKE_ARGS="-DGGML_CPU_ARM_ENABLE_I8MM=OFF -DGGML_CPU_ARM_USE_I8MM=OFF"
          echo "🔧 CMAKE_ARGS=${CMAKE_ARGS}"
          export PIP_NO_BUILD_ISOLATION=0
          echo "📦 Installing Python dependencies..."
          python -m pip install --upgrade pip
          if ! python -m pip install --no-cache-dir --only-binary=:all: llama_cpp_python==0.3.14; then
            echo "ℹ️ Prebuilt llama_cpp_python wheel unavailable, building from source with ${CMAKE_ARGS}"
            python -m pip install --no-cache-dir llama_cpp_python==0.3.14
          fi
          python -m pip install --no-cache-dir -r requirements.txt

      - name: Reinstall universal wheels
        run: |
          set -euo pipefail
          mkdir -p universal_wheels

          PLATFORM_TAG="macosx_12_0_universal2"
          PYTHON_VERSION_STR="3.12"
          PYTHON_ABI_TAG="cp312"

          install_universal() {
            local package_name="$1"
            local package_version
            package_version=$(PACKAGE="$package_name" python - <<'PYV'
            import importlib.metadata as md
            import os
            print(md.version(os.environ["PACKAGE"]))
            PYV
            )
            echo "📦 Reinstalling ${package_name}==${package_version} as universal2"
            python -m pip download "${package_name}==${package_version}" \
              --dest universal_wheels \
              --only-binary=:all: \
              --platform "${PLATFORM_TAG}" \
              --implementation cp \
              --python-version "${PYTHON_VERSION_STR}" \
              --abi "${PYTHON_ABI_TAG}"

            local wheel_pattern
            wheel_pattern="$(echo "${package_name}" | tr '-' '_')-${package_version}-*.whl"
            python -m pip install --force-reinstall --no-deps "universal_wheels/${wheel_pattern}"
          }

          install_universal pydantic-core
          install_universal numpy
          install_universal scipy

          rm -rf universal_wheels

      - name: Prepare universal runtime dependencies
        run: |
          set -euo pipefail
          echo "🛠️ Preparing universal dependencies..."
          python -m build_support.prepare_universal_env || true

      - name: Build universal DMG
        run: |
          set -euo pipefail
          echo "🔨 Building universal DMG with ad-hoc signing..."
          python build_mac.py

      - name: Verify universal binaries
        run: |
          set -euo pipefail
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          DMG="PhysioClinicAssistant-${VERSION}-macOS.dmg"
          if [ ! -f "$DMG" ]; then
            echo "❌ DMG not found" >&2
            ls -lh
            exit 1
          fi

          echo "✅ DMG created: $DMG"
          hdiutil attach "$DMG" -mountpoint /tmp/dmg_verify -readonly
          EXECUTABLE="/tmp/dmg_verify/PhysioClinicAssistant.app/Contents/MacOS/PhysioClinicAssistant"
          echo "Main executable architectures:"
          lipo -info "$EXECUTABLE"

          echo "Key ggml library architectures:"
          find "/tmp/dmg_verify/PhysioClinicAssistant.app/Contents/Frameworks" \( -name "libggml*.dylib" -o -name "libllama.dylib" \) | while IFS= read -r lib; do
            echo "- $lib"
            lipo -info "$lib" 2>/dev/null || file "$lib"
          done

          hdiutil detach /tmp/dmg_verify

      - name: Rename DMG to universal variant
        run: |
          set -euo pipefail
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          mv "PhysioClinicAssistant-${VERSION}-macOS.dmg" "PhysioClinicAssistant-${VERSION}-macOS-universal.dmg"
          ls -lh PhysioClinicAssistant-*-macOS-universal.dmg

      - name: Upload universal DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: physioclinicassistant-macos-universal
          path: PhysioClinicAssistant-*-macOS-universal.dmg
          retention-days: 30

      - name: Build summary
        if: success()
        run: |
          {
            echo "## ✅ Universal Build Complete"
            echo "- Branch: $GITHUB_REF"
            echo "- DMG: PhysioClinicAssistant-${{ steps.get_version.outputs.VERSION }}-macOS-universal.dmg"
            echo "- Includes both x86_64 and arm64 slices"
          } >> "$GITHUB_STEP_SUMMARY"
